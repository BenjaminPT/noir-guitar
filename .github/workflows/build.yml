name: Build installers (Windows + macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch ASIO SDK (optional)
        id: asio
        shell: pwsh
        run: |
          $ok = $false
          try {
            Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip" -OutFile asio.zip -UseBasicParsing -MaximumRetryCount 3 -RetryIntervalSec 5
            Expand-Archive asio.zip -DestinationPath asio -Force
            $hdr = Get-ChildItem -Recurse asio -Filter iasiodrv.h | Select-Object -First 1
            if ($hdr) { "dir=$($hdr.Directory.Parent.FullName)" >> $env:GITHUB_OUTPUT; $ok = $true }
          } catch { Write-Host "ASIO download failed: $_" }
          if (-not $ok) { Write-Host "::warning::ASIO SDK not available - building without ASIO"; "dir=" >> $env:GITHUB_OUTPUT }

      - name: Configure
        shell: pwsh
        run: |
          $asio = "${{ steps.asio.outputs.dir }}"
          $a = @("-S",".","-B","build","-G","Ninja","-DCMAKE_BUILD_TYPE=Release","-DCMAKE_C_COMPILER=cl","-DCMAKE_CXX_COMPILER=cl")
          if ($asio) { $a += "-DASIO_SDK_DIR=$asio" }
          cmake @a

      - name: Build
        run: cmake --build build --parallel

      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          $vst = Get-ChildItem -Recurse -Directory build -Filter "Noir Guitar.vst3" | Select-Object -First 1
          Copy-Item $vst.FullName -Destination "stage\Noir Guitar.vst3" -Recurse
          $exe = Get-ChildItem -Recurse -File build -Filter "Noir Guitar.exe" | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "stage\Noir Guitar.exe"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\NoirGuitar.iss

      - uses: actions/upload-artifact@v4
        with:
          name: NoirGuitar-Setup
          path: dist/NoirGuitar-Setup.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Stage bundles
        run: |
          mkdir -p stage
          vst=$(find build -type d -name "Noir Guitar.vst3" | head -n 1)
          au=$(find build -type d -name "Noir Guitar.component" | head -n 1)
          app=$(find build -type d -name "Noir Guitar.app" | head -n 1)
          echo "vst3=$vst"; echo "au=$au"; echo "app=$app"
          test -n "$vst" && test -n "$au" && test -n "$app"
          cp -R "$vst" "$au" "$app" stage/
          # ad-hoc signature: required for arm64 binaries to load at all
          for b in stage/*; do codesign --force --deep -s - "$b"; done
          lipo -archs "stage/Noir Guitar.app/Contents/MacOS/Noir Guitar"

      - name: Build installer package
        run: |
          mkdir -p pkgroot/vst3/Library/Audio/Plug-Ins/VST3 pkgroot/au/Library/Audio/Plug-Ins/Components pkgroot/app/Applications pkgs dist
          cp -R "stage/Noir Guitar.vst3" pkgroot/vst3/Library/Audio/Plug-Ins/VST3/
          cp -R "stage/Noir Guitar.component" pkgroot/au/Library/Audio/Plug-Ins/Components/
          cp -R "stage/Noir Guitar.app" pkgroot/app/Applications/
          pkgbuild --root pkgroot/vst3 --identifier com.noiraudio.noirguitar.vst3 --version 1.0 --install-location / pkgs/vst3.pkg
          pkgbuild --root pkgroot/au   --identifier com.noiraudio.noirguitar.au   --version 1.0 --install-location / pkgs/au.pkg
          pkgbuild --root pkgroot/app  --identifier com.noiraudio.noirguitar.app  --version 1.0 --install-location / pkgs/app.pkg
          productbuild --distribution installer/mac/distribution.xml --package-path pkgs dist/NoirGuitar-macOS.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: NoirGuitar-macOS
          path: dist/NoirGuitar-macOS.pkg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Noir Guitar v1.0.${{ github.run_number }}
          files: |
            dist/NoirGuitar-Setup.exe
            dist/NoirGuitar-macOS.pkg
